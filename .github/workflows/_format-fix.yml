name: Temporary final format fix

on:
  pull_request:

permissions:
  contents: write

jobs:
  prettier-fix:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - uses: actions/setup-node@v6
        with:
          node-version-file: apps/mobile/.nvmrc
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json
      - run: npm --prefix apps/mobile ci
      - name: Apply exact Prettier output
        working-directory: apps/mobile
        run: npx prettier src/AccountPrivacyPanel.tsx src/auth/AuthContext.tsx src/auth/supabase.test.ts src/auth/supabase.ts src/journey/JourneyContext.tsx e2e/v08_demo.spec.ts --write
      - name: Commit formatting if needed
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/mobile/src/AccountPrivacyPanel.tsx apps/mobile/src/auth/AuthContext.tsx apps/mobile/src/auth/supabase.test.ts apps/mobile/src/auth/supabase.ts apps/mobile/src/journey/JourneyContext.tsx apps/mobile/e2e/v08_demo.spec.ts
          git commit -m "Apply final Prettier formatting"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
