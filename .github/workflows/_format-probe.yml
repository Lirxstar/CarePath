name: Temporary format probe

on:
  pull_request:

permissions:
  contents: read

jobs:
  prettier-diff:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: apps/mobile/.nvmrc
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json
      - run: npm --prefix apps/mobile ci
      - name: Show exact Prettier diff
        working-directory: apps/mobile
        run: |
          npx prettier src/AccountPrivacyPanel.tsx src/auth/supabase.test.ts src/auth/supabase.ts src/journey/JourneyContext.tsx --write
          git diff -- src/AccountPrivacyPanel.tsx src/auth/supabase.test.ts src/auth/supabase.ts src/journey/JourneyContext.tsx
