name: Temporary Ruff diagnostic

on:
  pull_request:

permissions:
  contents: read

jobs:
  ruff:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: requirements-dev.lock
      - run: python -m pip install -c requirements-dev.lock ruff
      - name: Capture Ruff output
        run: |
          set +e
          ruff check backend/storage/private_sessions.py backend/api/app/session_scope.py tests/test_optional_auth_private_mode.py --output-format=concise > /tmp/ruff.txt 2>&1
          status=$?
          cat /tmp/ruff.txt
          echo "$status" > /tmp/ruff-status.txt
          exit 0
      - uses: actions/upload-artifact@v4
        with:
          name: temporary-ruff-diagnostic
          path: |
            /tmp/ruff.txt
            /tmp/ruff-status.txt
          if-no-files-found: error
