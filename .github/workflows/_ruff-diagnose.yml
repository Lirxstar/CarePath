name: Temporary Ruff diagnostic

on:
  pull_request:

permissions:
  contents: read

jobs:
  ruff:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: requirements-dev.lock
      - run: python -m pip install -c requirements-dev.lock ruff
      - run: ruff check backend/storage/private_sessions.py backend/api/app/session_scope.py tests/test_optional_auth_private_mode.py --output-format=concise
