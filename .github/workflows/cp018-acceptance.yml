name: CP-018 acceptance gate

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cp018-acceptance-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  measured-synthetic-evaluation:
    name: Measured mock-provider B0-B3 evaluation
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      CAREPATH_ENVIRONMENT: test
      CAREPATH_LLM_PROVIDER: mock
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements-dev.lock
      - name: Install evaluation dependencies
        run: python -m pip install -c requirements-dev.lock -e '.[dev]'
      - name: Run measured B0-B3 synthetic evaluation
        run: |
          carepath-evaluate \
            --measured-mock \
            --benchmark-valid \
            --run-id "cp018-${GITHUB_SHA}" \
            --output-dir test-results/cp018
      - name: Apply frozen CP-018 thresholds
        run: |
          carepath-acceptance \
            test-results/cp018 \
            --output-dir test-results/cp018
      - name: Upload engineering acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cp018-acceptance-${{ github.run_attempt }}
          path: test-results/cp018/**
          if-no-files-found: error
