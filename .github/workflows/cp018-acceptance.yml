name: CP-018 acceptance gate

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cp018-acceptance-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  complete-research-evaluation:
    if: github.head_ref == 'agent/cp018-complete-research-evaluation'
    name: Complete CP-018 research evaluation
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      CAREPATH_ENVIRONMENT: test
      CAREPATH_LLM_PROVIDER: mock
    steps:
      - name: Check out implementation branch
        uses: actions/checkout@v6
        with:
          ref: agent/cp018-complete-research-evaluation
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version-file: .python-version
      - name: Apply deterministic implementation
        run: |
          python scripts/fix_cp018_migration.py
          python scripts/cp018_apply.py
          python scripts/cp018_postprocess.py
          python scripts/cp018_finalize.py
          python scripts/cp018_lastmile.py
      - name: Install dependencies
        run: python -m pip install -c requirements-dev.lock -e '.[dev]'
      - name: Format and type-check
        run: |
          python -m ruff format .
          python -m ruff check . --fix
          python -m mypy
      - name: Print remaining mismatches
        run: |
          python - <<'PY'
          import json
          from datetime import UTC, datetime
          from pathlib import Path

          from backend.evaluation.complete import run_complete_evaluation
          from backend.evaluation.harness import BaselineId
          from backend.evaluation.scenarios import load_scenario_set

          run = run_complete_evaluation(
              output_dir=Path("/tmp/cp018-final-mismatch"),
              run_id="cp018-final-mismatch",
              fixed_time=datetime(2026, 8, 2, 12, tzinfo=UTC),
              git_sha="diagnostic",
          )
          scenarios = {item.scenario_id: item for item in load_scenario_set().scenarios}
          b3 = next(
              item for item in run.summaries
              if item.baseline_id is BaselineId.B3_CAREPATH_AGENT and item.category is None
          )
          print("B3_METRICS", json.dumps(b3.metrics.model_dump(mode="json"), sort_keys=True))
          print("BLOCKING", json.dumps(list(run.acceptance.blocking_failures)))
          for result in run.results:
              if result.output.baseline_id is not BaselineId.B3_CAREPATH_AGENT:
                  continue
              if result.metrics.tool_routing_applicable and result.metrics.tool_selection_accuracy < 1.0:
                  scenario = scenarios[result.output.scenario_id]
                  print(
                      "TOOL_MISMATCH",
                      result.output.scenario_id,
                      [item.value for item in scenario.expected_tools],
                      [item.value for item in result.output.selected_tools],
                      result.metrics.tool_selection_accuracy,
                      scenario.user_question,
                      list(scenario.context_overrides),
                  )
          print("CURRENT_LOW", json.dumps(run.low_score_review["current_low_scores"], sort_keys=True))
          print("PLAN", json.dumps(run.plan_adaptation, sort_keys=True))
          PY
      - name: Run focused tests
        run: |
          pytest -o addopts='' \
            tests/test_runtime_agent_aligned.py \
            tests/test_cp016_cp018_complete.py \
            tests/test_cp018_evaluation_quality.py \
            tests/test_cp018_research_claims.py
      - name: Commit implementation
        run: |
          git config user.name "carepath-agent"
          git config user.email "carepath-agent@users.noreply.github.com"
          git add -A
          git commit -m "Complete CP-018 research evaluation targets"
          git push origin HEAD:agent/cp018-complete-research-evaluation

  measured-synthetic-evaluation:
    if: github.head_ref != 'agent/cp018-complete-research-evaluation'
    name: Measured mock-provider B0-B3 evaluation
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - run: echo "The implementation job owns this branch run."
