name: CP-019 public deployment

on:
  pull_request:
    paths:
      - backend/api/app/health.py
      - deployment/public_backend_url.txt
      - deployment/verify_backend.py
      - tests/test_deployment_health.py
      - tests/test_deployment_verifier.py
      - .github/workflows/cp019-public-deployment.yml
  push:
    branches:
      - main
    paths:
      - backend/api/app/health.py
      - deployment/public_backend_url.txt
      - deployment/verify_backend.py
      - tests/test_deployment_health.py
      - tests/test_deployment_verifier.py
      - .github/workflows/cp019-public-deployment.yml

permissions:
  contents: read

jobs:
  verify-public-backend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Verify public backend
        shell: bash
        run: |
          set -euo pipefail
          public_url="$(tr -d '\r\n' < deployment/public_backend_url.txt)"
          expected_args=()
          if [[ "${GITHUB_EVENT_NAME}" == "push" ]]; then
            expected_args=(
              --expected-commit "${GITHUB_SHA}"
              --confirmations 3
              --confirmation-interval 5
            )
          fi

          for attempt in {1..20}; do
            echo "Public deployment verification attempt ${attempt}/20"
            if python deployment/verify_backend.py "${public_url}" "${expected_args[@]}"; then
              exit 0
            fi
            if [ "${attempt}" -eq 20 ]; then
              echo "Public backend did not reach the required deployment state after 20 attempts." >&2
              exit 1
            fi
            sleep 15
          done
