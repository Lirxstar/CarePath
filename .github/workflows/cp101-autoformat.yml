name: CP-101 temporary auto-format

on:
  push:
    branches:
      - agent/cp101-completion-tooling

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: agent/cp101-completion-tooling

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Ruff
        run: python -m pip install ruff==0.16.0

      - name: Format CP-101 files
        run: |
          python -m ruff format \
            backend/api/app/llm/radeon_local.py \
            evaluation/amd/local_full_run.py \
            evaluation/amd/real_provider_suite.py \
            evaluation/amd/validate_cp101.py \
            tests/test_cp101_real_provider_suite.py \
            tests/test_radeon_provider.py

      - name: Commit formatting
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/api/app/llm/radeon_local.py \
            evaluation/amd/local_full_run.py \
            evaluation/amd/real_provider_suite.py \
            evaluation/amd/validate_cp101.py \
            tests/test_cp101_real_provider_suite.py \
            tests/test_radeon_provider.py
          git commit -m "Format CP-101 completion tooling"
          git push origin HEAD:agent/cp101-completion-tooling
