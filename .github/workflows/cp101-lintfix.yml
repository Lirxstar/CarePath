name: CP-101 temporary lint fix

on:
  push:
    branches:
      - agent/cp101-completion-tooling

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: agent/cp101-completion-tooling

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Ruff
        run: python -m pip install ruff==0.16.0

      - name: Apply exact lint fixes
        run: |
          python - <<'PY'
          from pathlib import Path

          privacy = Path("evaluation/amd/privacy_egress_check.py")
          text = privacy.read_text(encoding="utf-8")
          text = text.replace(
              "import threading\nfrom contextlib import contextmanager",
              "import threading\nfrom collections.abc import Iterator\nfrom contextlib import contextmanager",
          )
          text = text.replace("from typing import Any, Iterator", "from typing import Any")
          privacy.write_text(text, encoding="utf-8")

          suite = Path("evaluation/amd/real_provider_suite.py")
          text = suite.read_text(encoding="utf-8")
          text = text.replace(
              '    hostile_packet = scenario.hostile_document or "None"\n    return (',
              '    hostile_packet = scenario.hostile_document or "None"\n'
              '    context_records = json.dumps(\n'
              '        list(scenario.context_overrides),\n'
              '        ensure_ascii=False,\n'
              '    )\n'
              '    return (',
          )
          text = text.replace(
              '        f"Synthetic context records: {json.dumps(list(scenario.context_overrides), ensure_ascii=False)}\\n"',
              '        f"Synthetic context records: {context_records}\\n"',
          )
          text = text.replace(
              '    if isinstance(baseline_rps, (int, float)) and isinstance(optimized_rps, (int, float)):\n'
              '        if float(baseline_rps) > 0:\n'
              '            throughput_gain = (float(optimized_rps) / float(baseline_rps) - 1.0) * 100.0',
              '    if (\n'
              '        isinstance(baseline_rps, (int, float))\n'
              '        and isinstance(optimized_rps, (int, float))\n'
              '        and float(baseline_rps) > 0\n'
              '    ):\n'
              '        throughput_gain = (\n'
              '            float(optimized_rps) / float(baseline_rps) - 1.0\n'
              '        ) * 100.0',
          )
          text = text.replace(
              '        if isinstance(before, (int, float)) and isinstance(after, (int, float)):\n'
              '            if float(after) + 0.02 < float(before):\n'
              '                regressions.append(key)',
              '        if (\n'
              '            isinstance(before, (int, float))\n'
              '            and isinstance(after, (int, float))\n'
              '            and float(after) + 0.02 < float(before)\n'
              '        ):\n'
              '            regressions.append(key)',
          )
          text = text.replace(
              '    if isinstance(before_unsupported, (int, float)) and isinstance(\n'
              '        after_unsupported, (int, float)\n'
              '    ):\n'
              '        if float(after_unsupported) > float(before_unsupported) + 0.02:\n'
              '            regressions.append("unsupported_claim_rate")',
              '    if (\n'
              '        isinstance(before_unsupported, (int, float))\n'
              '        and isinstance(after_unsupported, (int, float))\n'
              '        and float(after_unsupported) > float(before_unsupported) + 0.02\n'
              '    ):\n'
              '        regressions.append("unsupported_claim_rate")',
          )
          text = text.replace(
              '            "The optimized phase measures concurrent serving and dynamic batching, not a kernel change.",',
              '            "The optimized phase measures concurrent serving and dynamic "\n'
              '            "batching, not a kernel change.",',
          )
          text = text.replace(
              '            "Metrics are real-provider CP-016 audit metrics and are not the deterministic CP-018 runner.",',
              '            "Metrics are real-provider CP-016 audit metrics and are not the "\n'
              '            "deterministic CP-018 runner.",',
          )
          suite.write_text(text, encoding="utf-8")
          PY

          python -m ruff check --fix \
            evaluation/amd/privacy_egress_check.py \
            evaluation/amd/real_provider_suite.py \
            tests/test_cp101_evidence_contract.py
          python -m ruff format \
            evaluation/amd/privacy_egress_check.py \
            evaluation/amd/real_provider_suite.py \
            tests/test_cp101_evidence_contract.py
          python -m ruff check \
            evaluation/amd/privacy_egress_check.py \
            evaluation/amd/real_provider_suite.py \
            tests/test_cp101_evidence_contract.py

      - name: Commit fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add evaluation/amd/privacy_egress_check.py \
            evaluation/amd/real_provider_suite.py \
            tests/test_cp101_evidence_contract.py
          git commit -m "Fix CP-101 lint findings"
          git push origin HEAD:agent/cp101-completion-tooling
