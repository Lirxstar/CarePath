name: CP-201 Tokyo data layer

on:
  pull_request:
    paths:
      - "backend/tokyo/**"
      - "data/tokyo/**"
      - "tests/test_tokyo_data.py"
      - "pyproject.toml"
      - ".github/workflows/cp201-tokyo-data.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cp201:
    name: Validate Tokyo data contract
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements-dev.lock
      - name: Install dependencies
        run: python -m pip install -c requirements-dev.lock -e '.[dev]'
      - name: Validate source registry
        run: carepath-tokyo-data validate-registry
      - name: Run CP-201 unit tests
        run: python -m pytest tests/test_tokyo_data.py --no-cov
      - name: Live official-source rebuild smoke
        run: |
          carepath-tokyo-data refresh \
            --output /tmp/tokyo-resources.jsonl \
            --report /tmp/tokyo-build-report.json \
            --raw-dir /tmp/tokyo-raw
          test -s /tmp/tokyo-resources.jsonl
          python - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path('/tmp/tokyo-build-report.json').read_text())
          assert report['resources'] > 0
          assert all(item['error'] is None for item in report['source_results'])
          assert all(item['accepted_records'] > 0 for item in report['source_results'])
          print(json.dumps(report, ensure_ascii=False, indent=2))
          PY
      - name: Upload reproducibility evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cp201-tokyo-data-${{ github.run_attempt }}
          path: |
            /tmp/tokyo-build-report.json
          if-no-files-found: warn
