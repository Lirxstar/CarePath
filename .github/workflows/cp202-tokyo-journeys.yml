name: CP-202 Tokyo journeys

on:
  pull_request:
    paths:
      - "backend/tokyo/journeys.py"
      - "backend/tokyo/__init__.py"
      - "data/tokyo/journeys.json"
      - "docs/cp202_tokyo_journeys.md"
      - "apps/mobile/e2e/tokyoFixtures.mjs"
      - "tests/test_cp202_tokyo_journeys.py"
      - ".github/workflows/cp202-tokyo-journeys.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    name: Validate multilingual journey contract
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements-dev.lock
      - name: Install Python dependencies
        run: python -m pip install -c requirements-dev.lock -e '.[dev]'
      - name: Validate Python contract
        run: python -m pytest tests/test_cp202_tokyo_journeys.py --no-cov
      - uses: actions/setup-node@v6
        with:
          node-version-file: apps/mobile/.nvmrc
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json
      - name: Install frontend dependencies
        working-directory: apps/mobile
        run: npm ci
      - name: Render canonical browser fixture formatting
        working-directory: apps/mobile
        run: npx prettier e2e/tokyoFixtures.mjs
      - name: Validate browser fixture consumer
        run: node apps/mobile/e2e/tokyoFixtures.mjs
