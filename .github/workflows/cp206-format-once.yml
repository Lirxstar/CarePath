name: CP-206 format once

on:
  pull_request:
    paths:
      - "apps/mobile/src/tokyo/**"
      - "apps/mobile/e2e/tokyo_web.spec.ts"
      - ".github/workflows/cp206-format-once.yml"

permissions:
  contents: write

jobs:
  format:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.head_ref }}
      - uses: actions/setup-node@v6
        with:
          node-version-file: apps/mobile/.nvmrc
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json
      - working-directory: apps/mobile
        run: npm ci
      - working-directory: apps/mobile
        run: >-
          npx prettier --write
          src/tokyo/api.ts
          src/tokyo/copy.ts
          src/tokyo/TokyoScreen.tsx
          e2e/tokyo_web.spec.ts
      - name: Commit formatter output
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- apps/mobile/src/tokyo apps/mobile/e2e/tokyo_web.spec.ts; then
            echo "No formatter changes needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/mobile/src/tokyo apps/mobile/e2e/tokyo_web.spec.ts
          git commit -m "Format CP-206 frontend"
          git push origin "HEAD:${GITHUB_HEAD_REF}"
