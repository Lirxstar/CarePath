name: CP-206 lint fix once

on:
  pull_request:
    paths:
      - "apps/mobile/src/tokyo/TokyoScreen.tsx"
      - ".github/workflows/cp206-lint-fix-once.yml"

permissions:
  contents: write

jobs:
  fix:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.head_ref }}
      - uses: actions/setup-node@v6
        with:
          node-version-file: apps/mobile/.nvmrc
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json
      - working-directory: apps/mobile
        run: npm ci
      - name: Apply deterministic lint fix
        working-directory: apps/mobile
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path("src/tokyo/TokyoScreen.tsx")
          text = path.read_text(encoding="utf-8")
          old = "const sourceUrl = provenance?.source_url || provenance?.catalog_url || null;"
          new = "const sourceUrl = provenance?.source_url ?? provenance?.catalog_url ?? null;"
          if old not in text:
              raise SystemExit("expected sourceUrl expression not found")
          path.write_text(text.replace(old, new), encoding="utf-8")
          PY
          npx eslint src/tokyo/TokyoScreen.tsx --fix
          npx prettier --write src/tokyo/TokyoScreen.tsx
          npx eslint src/tokyo/TokyoScreen.tsx --max-warnings=0
      - name: Commit lint fixes
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- apps/mobile/src/tokyo/TokyoScreen.tsx; then
            echo "No lint changes needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/mobile/src/tokyo/TokyoScreen.tsx
          git commit -m "Fix CP-206 frontend lint"
          git push origin "HEAD:${GITHUB_HEAD_REF}"
