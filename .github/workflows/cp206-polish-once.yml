name: CP-206 polish once

on:
  pull_request:
    paths:
      - "apps/mobile/src/tokyo/api.test.ts"
      - ".github/workflows/cp206-polish-once.yml"

permissions:
  contents: write

jobs:
  polish:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.head_ref }}
      - uses: actions/setup-node@v6
        with:
          node-version-file: apps/mobile/.nvmrc
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json
      - working-directory: apps/mobile
        run: npm ci
      - name: Format and validate CP-206 unit coverage changes
        working-directory: apps/mobile
        run: |
          npx prettier --write src/tokyo/api.test.ts src/navigation.ts src/navigation.test.ts jest.config.cjs
          npx eslint src/tokyo/api.test.ts src/navigation.ts src/navigation.test.ts --max-warnings=0
          npx tsc --noEmit
      - name: Commit formatter output
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- apps/mobile; then
            echo "No formatter changes needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/mobile
          git commit -m "Format CP-206 coverage tests"
          git push origin "HEAD:${GITHUB_HEAD_REF}"
