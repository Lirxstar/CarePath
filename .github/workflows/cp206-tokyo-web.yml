name: CP-206 Tokyo web experience

on:
  pull_request:
    paths:
      - "Dockerfile"
      - "backend/api/app/main.py"
      - "backend/api/app/tokyo_routes.py"
      - "backend/tokyo/**"
      - "data/tokyo/**"
      - "apps/mobile/App.tsx"
      - "apps/mobile/src/AppNavigator.tsx"
      - "apps/mobile/src/navigation.ts"
      - "apps/mobile/src/tokyo/**"
      - "apps/mobile/e2e/tokyo_web.spec.ts"
      - "apps/mobile/e2e/playwright.v08.config.ts"
      - "tests/test_cp206_tokyo_web.py"
      - "docs/cp206_tokyo_web.md"
      - ".github/workflows/cp206-tokyo-web.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    name: Validate Tokyo-first product contract
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements-dev.lock
      - name: Install backend dependencies
        run: python -m pip install -c requirements-dev.lock -e '.[dev]'
      - name: Check CP-206 Python formatting and lint
        run: |
          python -m ruff format --check backend/api/app/main.py tests/test_cp206_tokyo_web.py
          python -m ruff check backend/api/app/main.py tests/test_cp206_tokyo_web.py
      - name: Run Tokyo backend regression suite
        run: |
          python -m pytest \
            tests/test_cp202_tokyo_journeys.py \
            tests/test_cp203_tokyo_search.py \
            tests/test_cp204_tokyo_agent.py \
            tests/test_cp205_tokyo_safety.py \
            tests/test_cp206_tokyo_web.py \
            --no-cov
      - uses: actions/setup-node@v6
        with:
          node-version-file: apps/mobile/.nvmrc
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json
      - name: Install frontend dependencies
        working-directory: apps/mobile
        run: npm ci
      - name: Check CP-206 frontend formatting
        working-directory: apps/mobile
        run: >-
          npx prettier --check
          App.tsx
          src/AppNavigator.tsx
          src/navigation.ts
          src/tokyo
          e2e/tokyo_web.spec.ts
          e2e/playwright.v08.config.ts
      - name: Lint and type-check frontend
        working-directory: apps/mobile
        run: |
          npm run lint
          npm run typecheck
      - name: Run Tokyo frontend unit tests
        working-directory: apps/mobile
        run: npx jest src/tokyo/api.test.ts --runInBand
      - name: Export Tokyo-capable Expo Web bundle
        working-directory: apps/mobile
        run: npm run bundle:web
