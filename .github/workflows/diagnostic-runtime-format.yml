name: Diagnostic runtime formatter diff

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  formatter-diff:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements-dev.lock
      - run: python -m pip install -c requirements-dev.lock -e '.[dev]'
      - name: Show exact Ruff formatter diff
        run: python -m ruff format --diff backend/evaluation/runtime_agent_runner.py
