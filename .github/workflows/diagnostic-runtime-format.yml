name: One-time runtime formatter fix

on:
  pull_request:

permissions:
  contents: write

jobs:
  formatter-fix:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.head_ref }}
      - uses: actions/setup-python@v6
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements-dev.lock
      - run: python -m pip install -c requirements-dev.lock -e '.[dev]'
      - name: Apply exact Ruff formatter result
        run: python -m ruff format backend/evaluation/runtime_agent_runner.py
      - name: Commit formatter-only change
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/evaluation/runtime_agent_runner.py
          git commit -m "Format production agent evaluation runner"
          git push origin "HEAD:${GITHUB_HEAD_REF}"
