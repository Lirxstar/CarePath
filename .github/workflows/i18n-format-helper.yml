name: i18n format helper

on:
  push:
    branches:
      - agent/remove-demo-banner-full-i18n

permissions:
  contents: write

jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/remove-demo-banner-full-i18n
      - name: Remove helper from the feature branch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/workflows/i18n-format-helper.yml
          git commit -m "Remove temporary i18n format helper"
          git push origin HEAD:agent/remove-demo-banner-full-i18n
