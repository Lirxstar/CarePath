name: i18n lint fix helper

on:
  push:
    branches:
      - agent/remove-demo-banner-full-i18n

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/remove-demo-banner-full-i18n
      - uses: actions/setup-node@v6
        with:
          node-version-file: apps/mobile/.nvmrc
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json
      - working-directory: apps/mobile
        run: npm ci
      - name: Fix remaining catalog lint rules
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('apps/mobile/src/i18n/catalog.ts')
          text = path.read_text()
          replacements = {
              'const leading = input.match(/^\\s*/)?.[0] ?? "";': 'const leading = /^\\s*/.exec(input)?.[0] ?? "";',
              'const trailing = input.match(/\\s*$/)?.[0] ?? "";': 'const trailing = /\\s*$/.exec(input)?.[0] ?? "";',
              'return translated === null || translated === undefined\n    ? input': 'return translated === null\n    ? input',
          }
          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f'expected catalog text not found: {old}')
              text = text.replace(old, new, 1)
          path.write_text(text)
          PY
      - name: Format and verify frontend
        working-directory: apps/mobile
        run: |
          npx prettier --write src/i18n/catalog.ts src/i18n/catalog.test.ts src/i18n/WebLocaleTranslator.tsx
          npm run lint
          npm run typecheck
          npx jest --runInBand src/i18n/catalog.test.ts
      - name: Commit verified fix and remove helper
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/workflows/i18n-lint-fix-helper.yml
          git add apps/mobile/src/i18n/catalog.ts apps/mobile/src/i18n/catalog.test.ts apps/mobile/src/i18n/WebLocaleTranslator.tsx
          git commit -m "Fix typed i18n lint issues"
          git push origin HEAD:agent/remove-demo-banner-full-i18n
