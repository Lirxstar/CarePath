name: One-time evaluation lint fix

on:
  pull_request:

permissions:
  contents: write

jobs:
  lint-fix:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.head_ref }}
      - uses: actions/setup-python@v6
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements-dev.lock
      - run: python -m pip install -c requirements-dev.lock -e '.[dev]'
      - name: Apply exact long-line suppressions
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("backend/evaluation/runtime_agent_runner.py")
          content = path.read_text(encoding="utf-8")
          replacements = {
              '                    "Reducing trip hazards and using conservative activity can support fall prevention.",':
              '                    "Reducing trip hazards and using conservative activity can support fall prevention.",  # noqa: E501',
              '                    "Small achievable actions and review of completion can support behaviour change.",':
              '                    "Small achievable actions and review of completion can support behaviour change.",  # noqa: E501',
          }
          for source, target in replacements.items():
              if source not in content and target not in content:
                  raise SystemExit(f"Expected line not found: {source}")
              content = content.replace(source, target)
          path.write_text(content, encoding="utf-8")
          PY
      - name: Validate formatter and lint
        run: |
          python -m ruff format --check \
            backend/evaluation/runtime_agent_runner.py \
            backend/evaluation/runtime_agent_production_runner.py
          python -m ruff check \
            backend/evaluation/runtime_agent_runner.py \
            backend/evaluation/runtime_agent_production_runner.py
      - name: Commit lint-only change
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/evaluation/runtime_agent_runner.py
          git commit -m "Fix evaluation runner lint"
          git push origin "HEAD:${GITHUB_HEAD_REF}"
