name: One-time evaluation formatting

on:
  pull_request:

permissions:
  contents: write

jobs:
  format:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.head_ref }}
      - uses: actions/setup-python@v6
        with:
          python-version-file: .python-version
      - run: python -m pip install -c requirements-dev.lock ruff
      - name: Apply exact Ruff formatting
        run: |
          python -m ruff format \
            backend/agents/tool_router.py \
            backend/evaluation/complete_metrics.py \
            backend/evaluation/runtime_agent_production_runner.py \
            backend/evaluation/runtime_agent_valid_fixture_runner.py \
            tests/test_cp016_cp018_complete.py
      - name: Commit formatter output
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            backend/agents/tool_router.py \
            backend/evaluation/complete_metrics.py \
            backend/evaluation/runtime_agent_production_runner.py \
            backend/evaluation/runtime_agent_valid_fixture_runner.py \
            tests/test_cp016_cp018_complete.py
          git commit -m "Format evaluation quality implementation"
          git push origin "HEAD:${GITHUB_HEAD_REF}"
