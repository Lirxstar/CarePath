name: One-time evaluation import sorting

on:
  pull_request:

permissions:
  contents: write

jobs:
  imports:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.head_ref }}
      - uses: actions/setup-python@v6
        with:
          python-version-file: .python-version
      - run: python -m pip install -c requirements-dev.lock ruff
      - name: Apply exact Ruff import sorting
        run: |
          python -m ruff check --fix --select I \
            backend/evaluation/complete.py \
            backend/evaluation/runtime_agent_production_runner.py \
            backend/evaluation/runtime_agent_valid_fixture_runner.py \
            tests/test_runtime_agent_aligned.py
      - name: Commit import sorting
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            backend/evaluation/complete.py \
            backend/evaluation/runtime_agent_production_runner.py \
            backend/evaluation/runtime_agent_valid_fixture_runner.py \
            tests/test_runtime_agent_aligned.py
          git commit -m "Sort evaluation imports"
          git push origin "HEAD:${GITHUB_HEAD_REF}"
