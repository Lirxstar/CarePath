name: One-time evidence mapping fix

on:
  pull_request:

permissions:
  contents: write

jobs:
  patch:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.head_ref }}
      - uses: actions/setup-python@v6
        with:
          python-version-file: .python-version
      - name: Stabilize non-gold evidence IDs and citation applicability
        run: |
          python - <<'PY'
          from pathlib import Path

          runner = Path("backend/evaluation/runtime_agent_valid_fixture_runner.py")
          content = runner.read_text(encoding="utf-8")
          marker = "\n\ndef _storage_metric(reference: str) -> str:\n"
          method = '''
              def _personal_refs(
                  self,
                  evidence_id: str,
                  fixture: EvaluationFixture,
              ) -> tuple[str, ...]:
                  mapped = super()._personal_refs(evidence_id, fixture)
                  if mapped:
                      return mapped
                  if evidence_id.startswith("patient:profile:"):
                      return ("profile:runtime_context",)
                  if evidence_id.startswith("patient:trend:"):
                      parts = evidence_id.split(":")
                      metric = parts[3] if len(parts) > 3 else "unknown"
                      return (f"observation:{metric}",)
                  if evidence_id.startswith("patient:event:"):
                      parts = evidence_id.split(":")
                      metric = parts[2] if len(parts) > 2 else "unknown"
                      return (f"event:{metric}",)
                  if evidence_id.startswith("patient:journal:"):
                      return ("journal:runtime_context",)
                  if evidence_id.startswith("patient:goal:"):
                      return ("profile:goal_context",)
                  if evidence_id.startswith("patient:plan:"):
                      return ("plan:runtime_context",)
                  return ()
          '''
          if method.strip() not in content:
              if marker not in content:
                  raise SystemExit("Storage metric marker not found")
              content = content.replace(marker, "\n" + method + marker)
          runner.write_text(content, encoding="utf-8")

          metrics = Path("backend/evaluation/complete_metrics.py")
          content = metrics.read_text(encoding="utf-8")
          source = "    citation_applicable = retrieval_applicable and bool(output.claims)\n"
          target = (
              "    citation_applicable = retrieval_applicable and any(\n"
              "        claim.is_medical for claim in output.claims\n"
              "    )\n"
          )
          if source not in content and target not in content:
              raise SystemExit("Citation applicability anchor not found")
          metrics.write_text(content.replace(source, target), encoding="utf-8")
          PY
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            backend/evaluation/runtime_agent_valid_fixture_runner.py \
            backend/evaluation/complete_metrics.py
          git commit -m "Stabilize runtime evidence mapping and citation scoring"
          git push origin "HEAD:${GITHUB_HEAD_REF}"
