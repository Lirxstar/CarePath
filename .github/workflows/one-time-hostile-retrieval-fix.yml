name: One-time hostile retrieval fix

on:
  pull_request:

permissions:
  contents: write

jobs:
  patch:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.head_ref }}
      - uses: actions/setup-python@v6
        with:
          python-version-file: .python-version
      - name: Route standalone hostile documents through production sanitization
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("backend/evaluation/runtime_agent_valid_fixture_runner.py")
          content = path.read_text(encoding="utf-8")
          start = content.index("        documents: list[tuple[str, str]] = []")
          loop = content.index(
              "        for reference in self.fixture.external_evidence_refs:",
              start,
          )
          prefix = (
              "        documents: list[tuple[str, str]] = []\n"
              "        has_untrusted_reference = any(\n"
              "            reference.startswith(\"untrusted_document:\")\n"
              "            for reference in self.fixture.external_evidence_refs\n"
              "        )\n"
              "        if self.request.hostile_document is not None and not has_untrusted_reference:\n"
              "            documents.append(\n"
              "                (\"untrusted_document:runtime_attack\", self.request.hostile_document)\n"
              "            )\n"
          )
          path.write_text(content[:start] + prefix + content[loop:], encoding="utf-8")
          PY
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/evaluation/runtime_agent_valid_fixture_runner.py
          git commit -m "Route standalone hostile documents through sanitization"
          git push origin "HEAD:${GITHUB_HEAD_REF}"
