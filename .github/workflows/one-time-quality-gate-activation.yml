name: One-time quality gate activation

on:
  pull_request:

permissions:
  contents: write

jobs:
  patch:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.head_ref }}
      - uses: actions/setup-python@v6
        with:
          python-version-file: .python-version
      - name: Activate measured B3 quality thresholds
        run: |
          python - <<'PY'
          from pathlib import Path

          models = Path("backend/evaluation/complete_models.py")
          content = models.read_text(encoding="utf-8")
          class_start = content.index("class CompleteAcceptanceReport(BaseModel):")
          class_end = content.index("\n\n\nclass CompleteRun", class_start)
          class_block = content[class_start:class_end]
          if "quality_thresholds:" not in class_block:
              anchor = "    evaluated_results: int"
              replacement = (
                  "    evaluated_results: int\n"
                  "    quality_thresholds: dict[str, float] = Field(default_factory=dict)\n"
                  "    observed_b3_metrics: dict[str, float] = Field(default_factory=dict)"
              )
              if anchor not in class_block:
                  raise SystemExit("Acceptance report fields not found")
              class_block = class_block.replace(anchor, replacement)
              content = content[:class_start] + class_block + content[class_end:]
          models.write_text(content, encoding="utf-8")

          complete = Path("backend/evaluation/complete.py")
          content = complete.read_text(encoding="utf-8")
          import_anchor = "from .complete_redteam import run_redteam\n"
          quality_import = (
              "from .quality_gate import (\n"
              "    QUALITY_THRESHOLDS,\n"
              "    evaluate_quality_thresholds,\n"
              "    observed_quality_metrics,\n"
              ")\n"
          )
          if quality_import not in content:
              content = content.replace(import_anchor, import_anchor + quality_import)

          quality_call = "    failures.extend(evaluate_quality_thresholds(b3.metrics))\n"
          if quality_call not in content:
              failure_line = '        failures.append("b3_runner_failure")\n'
              position = content.index(failure_line) + len(failure_line)
              content = content[:position] + quality_call + content[position:]

          report_start = content.index("    return CompleteAcceptanceReport(")
          report_end = content.index("\n    )", report_start)
          report_block = content[report_start:report_end]
          if "quality_thresholds=" not in report_block:
              anchor = "        evaluated_results=len(results),"
              replacement = (
                  "        evaluated_results=len(results),\n"
                  "        quality_thresholds=dict(QUALITY_THRESHOLDS),\n"
                  "        observed_b3_metrics=observed_quality_metrics(b3.metrics),"
              )
              if anchor not in report_block:
                  raise SystemExit("Acceptance report result fields not found")
              report_block = report_block.replace(anchor, replacement)
              content = content[:report_start] + report_block + content[report_end:]
          content = content.replace('schema_version="2.1"', 'schema_version="2.2"')
          complete.write_text(content, encoding="utf-8")

          tests = Path("tests/test_cp016_cp018_complete.py")
          content = tests.read_text(encoding="utf-8")
          assertion = '    assert run.acceptance.quality_thresholds["recall_at_5_min"] == 0.80\n'
          if assertion not in content:
              anchor = "    assert run.acceptance.blocking_failures == ()\n"
              addition = (
                  anchor
                  + assertion
                  + '    assert run.acceptance.observed_b3_metrics["citation_precision"] >= 0.95\n'
                  + '    assert run.acceptance.observed_b3_metrics["unmapped_evidence_rate"] == 0.0\n'
              )
              if anchor not in content:
                  raise SystemExit("Complete acceptance assertion not found")
              content = content.replace(anchor, addition, 1)
          tests.write_text(content, encoding="utf-8")
          PY
      - name: Commit activation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            backend/evaluation/complete.py \
            backend/evaluation/complete_models.py \
            tests/test_cp016_cp018_complete.py
          git commit -m "Enforce measured B3 quality thresholds"
          git push origin "HEAD:${GITHUB_HEAD_REF}"
