name: One-time red-team failure detail

on:
  pull_request:

permissions:
  contents: write

jobs:
  patch:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.head_ref }}
      - uses: actions/setup-python@v6
        with:
          python-version-file: .python-version
      - name: Show only failed red-team cases
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("tests/test_cp016_cp018_complete.py")
          content = path.read_text(encoding="utf-8")
          source = "    assert report.passed_count == report.case_count, report.results\n"
          target = (
              "    failed = [\n"
              "        result.model_dump(mode=\"json\")\n"
              "        for result in report.results\n"
              "        if not result.passed\n"
              "    ]\n"
              "    assert not failed, failed\n"
          )
          if source not in content and target not in content:
              raise SystemExit("Detailed red-team assertion anchor not found")
          path.write_text(content.replace(source, target), encoding="utf-8")
          PY
      - name: Commit detail assertion
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/test_cp016_cp018_complete.py
          git commit -m "Report failed red-team cases precisely"
          git push origin "HEAD:${GITHUB_HEAD_REF}"
