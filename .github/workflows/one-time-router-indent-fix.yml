name: One-time router indentation fix

on:
  pull_request:

permissions:
  contents: write

jobs:
  patch:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.head_ref }}
      - uses: actions/setup-python@v6
        with:
          python-version-file: .python-version
      - name: Restore class indentation
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("backend/agents/tool_router.py")
          content = path.read_text(encoding="utf-8")
          start = content.index("    @staticmethod\ndef _metrics")
          end = content.index("\n\n\n    @staticmethod\n    def _metric_call", start)
          block = (
              "    @staticmethod\n"
              "    def _metrics(text: str) -> list[MetricType]:\n"
              "        metrics = [\n"
              "            metric\n"
              "            for metric, terms in _METRIC_TERMS.items()\n"
              "            if any(term in text for term in terms)\n"
              "        ]\n"
              "        sleep_metrics = {\n"
              "            MetricType.SLEEP_DURATION,\n"
              "            MetricType.SLEEP_START_TIME,\n"
              "            MetricType.SLEEP_END_TIME,\n"
              "        }\n"
              "        if not any(metric in sleep_metrics for metric in metrics) and any(\n"
              "            term in text for term in (\"sleep\", \"slept\", \"睡眠\", \"睡\", \"眠\")\n"
              "        ):\n"
              "            metrics.insert(0, MetricType.SLEEP_DURATION)\n"
              "        return metrics"
          )
          path.write_text(content[:start] + block + content[end:], encoding="utf-8")
          PY
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/agents/tool_router.py
          git commit -m "Restore tool router method indentation"
          git push origin "HEAD:${GITHUB_HEAD_REF}"
