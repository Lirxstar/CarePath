name: One-time sleep routing fix

on:
  pull_request:

permissions:
  contents: write

jobs:
  patch:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.head_ref }}
      - uses: actions/setup-python@v6
        with:
          python-version-file: .python-version
      - name: Distinguish sleep duration, bedtime, and wake time
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("backend/agents/tool_router.py")
          content = path.read_text(encoding="utf-8")

          metric_start = content.index("    MetricType.SLEEP_DURATION: (")
          metric_end = content.index("    MetricType.STEPS:", metric_start)
          metric_block = '''    MetricType.SLEEP_DURATION: (
              "sleep duration",
              "hours slept",
              "how long did i sleep",
              "睡眠时长",
              "睡了多久",
              "睡眠時間",
          ),
          MetricType.SLEEP_START_TIME: (
              "bedtime",
              "fall asleep",
              "go to bed",
              "sleep start",
              "when do i sleep",
              "入睡",
              "就寝",
          ),
          MetricType.SLEEP_END_TIME: (
              "wake time",
              "wake up",
              "sleep end",
              "起床",
              "醒来",
          ),
          '''
          content = content[:metric_start] + metric_block + content[metric_end:]

          method_start = content.index(
              "    @staticmethod\n    def _metrics(text: str) -> list[MetricType]:"
          )
          method_end = content.index(
              "\n\n    @staticmethod\n    def _metric_call", method_start
          )
          method_block = '''    @staticmethod
          def _metrics(text: str) -> list[MetricType]:
              metrics = [
                  metric
                  for metric, terms in _METRIC_TERMS.items()
                  if any(term in text for term in terms)
              ]
              sleep_metrics = {
                  MetricType.SLEEP_DURATION,
                  MetricType.SLEEP_START_TIME,
                  MetricType.SLEEP_END_TIME,
              }
              if not any(metric in sleep_metrics for metric in metrics) and any(
                  term in text for term in ("sleep", "slept", "睡眠", "睡", "眠")
              ):
                  metrics.insert(0, MetricType.SLEEP_DURATION)
              return metrics
          '''
          content = content[:method_start] + method_block + content[method_end:]
          path.write_text(content, encoding="utf-8")
          PY
      - name: Commit fix
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/agents/tool_router.py
          git commit -m "Distinguish sleep timing metrics in tool routing"
          git push origin "HEAD:${GITHUB_HEAD_REF}"
