name: Repository quality

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: repository-quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Backend quality
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      CAREPATH_ENVIRONMENT: test
      CAREPATH_LLM_PROVIDER: mock
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements-dev.lock
      - name: Install quality dependencies
        run: python -m pip install -c requirements-dev.lock -e '.[dev]'
      - name: Check installed dependencies
        run: python -m pip check
      - name: Validate pre-commit configuration
        run: python -m pre_commit validate-config .pre-commit-config.yaml
      - name: Check Python formatting
        run: python -m ruff format --check .
      - name: Lint Python
        run: python -m ruff check .
      - name: Type-check Python
        run: python -m mypy
      - name: Test Python
        run: |
          mkdir -p test-results
          python -m pytest --junitxml=test-results/pytest.xml
      - name: Upload backend test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-reports-${{ github.run_attempt }}
          path: |
            coverage.xml
            test-results/pytest.xml
          if-no-files-found: warn

  frontend:
    name: Frontend quality
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: apps/mobile/.nvmrc
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json
      - name: Install frontend dependencies
        run: npm ci
      - name: Check frontend formatting
        run: npm run format:check
      - name: Lint frontend
        run: npm run lint
      - name: Type-check frontend
        run: npm run typecheck
      - name: Validate Expo configuration
        run: npm run expo:check
      - name: Bundle Expo iOS application
        run: npm run bundle:check
      - name: Bundle Expo Web application
        run: npm run bundle:web
      - name: Test frontend
        run: npm run test:ci
