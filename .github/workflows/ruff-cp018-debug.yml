name: Ruff CP-018 debug

on:
  pull_request:
    paths:
      - backend/evaluation/acceptance.py
      - tests/test_cp018_acceptance_gate.py
      - .github/workflows/ruff-cp018-debug.yml

permissions:
  contents: read

jobs:
  diagnostics:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version-file: .python-version
      - run: python -m pip install ruff==0.16.0
      - name: Print exact diagnostics
        run: python -m ruff check --output-format=concise backend/evaluation/acceptance.py tests/test_cp018_acceptance_gate.py || true
      - name: Print safe autofix diff
        run: python -m ruff check --fix --diff backend/evaluation/acceptance.py tests/test_cp018_acceptance_gate.py || true
