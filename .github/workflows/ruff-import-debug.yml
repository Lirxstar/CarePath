name: Ruff import debug

on:
  pull_request:
    paths:
      - backend/evaluation/reference.py
      - .github/workflows/ruff-import-debug.yml

permissions:
  contents: read

jobs:
  import-diff:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version-file: .python-version
      - run: python -m pip install ruff==0.16.0
      - name: Show exact import fix
        run: python -m ruff check --select I001 --fix --diff backend/evaluation/reference.py || true
