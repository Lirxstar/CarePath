name: Run fixed CP-018 evaluation patch

on:
  push:
    branches:
      - agent/cp018-complete-research-evaluation

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/cp018-complete-research-evaluation
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version-file: .python-version
      - name: Apply audited patch
        run: |
          python - <<'PY'
          import re
          import subprocess
          import traceback
          from pathlib import Path

          source = Path('.github/workflows/cp018-research-evaluation-patch.yml').read_text()
          match = re.search(
              r"run: \|\n          python - <<'PY'\n(?P<body>.*?)\n          PY\n",
              source,
              re.DOTALL,
          )
          try:
              if match is None:
                  raise RuntimeError('could not locate audited patch body')
              raw = match.group('body')
              body = '\n'.join(
                  line[10:] if line.startswith('          ') else line
                  for line in raw.splitlines()
              )
              exec(compile(body, 'cp018_patch.py', 'exec'), {'__name__': '__main__'})
          except Exception:
              details = traceback.format_exc()
              subprocess.run(['git', 'reset', '--hard', 'HEAD'], check=True)
              Path('cp018-patch-diagnostic.txt').write_text(details, encoding='utf-8')
          else:
              for path in (
                  '.github/workflows/run-cp018-patch.yml',
                  '.github/workflows/run-cp018-patch-diagnostic.yml',
                  '.github/workflows/run-cp018-patch-fixed.yml',
                  '.github/workflows/cp018-research-evaluation-patch.yml',
                  'cp018-patch-diagnostic.txt',
              ):
                  target = Path(path)
                  if target.exists():
                      target.unlink()
          PY
          git config user.name "carepath-agent"
          git config user.email "carepath-agent@users.noreply.github.com"
          git add -A
          git commit -m "Apply CP-018 research evaluation completion"
          git push origin HEAD:agent/cp018-complete-research-evaluation
