name: Temporary Coach fix applicator

on:
  push:
    branches:
      - agent/fix-coach-localization-and-degradation

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fix-coach-localization-and-degradation
      - name: Apply focused fixes
        run: python .github/tmp_apply_coach_fix.py
      - name: Remove temporary applicator files
        run: rm .github/tmp_apply_coach_fix.py .github/workflows/tmp-apply-coach-fix.yml
      - name: Commit applied fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix Coach localization and graceful evidence degradation"
          git push origin HEAD:agent/fix-coach-localization-and-degradation
