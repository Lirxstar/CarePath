name: Temporary feedback formatter diagnostic

on:
  pull_request:
    paths:
      - apps/mobile/**
      - backend/**
      - tests/**
      - .github/workflows/tmp-feedback-format-diagnostic.yml

permissions:
  contents: read

jobs:
  format-diff:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: apps/mobile/.nvmrc
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json
      - name: Show Prettier diff
        working-directory: apps/mobile
        run: |
          npm ci
          npx prettier --write .
          git diff -- .
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Show Ruff format diff
        run: |
          python -m pip install 'ruff==0.14.13'
          ruff format --diff backend tests
